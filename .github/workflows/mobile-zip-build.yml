name: 软糖网络-手机ZIP编译
on:
  push:
    branches: [main]
    paths: ['SoftCandyNetwork-Mobile-v1.0.3.zip']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: 解压ZIP并编译
        run: |
          unzip -q SoftCandyNetwork-Mobile-v1.0.3.zip -d candy
          bash candy/tooling/build_in_actions.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SoftCandyNetwork-v1.0.3-debug-apk
          path: dist/*
          if-no-files-found: error
