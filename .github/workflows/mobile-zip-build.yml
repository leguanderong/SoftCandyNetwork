
name: 软糖网络-手机ZIP编译

on:
  push:
    branches: [main]
    paths:
      - 'SoftCandyNetwork-Mobile-v1.0.3.zip'
      - '.github/workflows/mobile-zip-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译软糖网络APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: 4. 初始化 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: 5. 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 6. 解压工程
        shell: bash
        run: |
          set -euo pipefail
          ZIP='SoftCandyNetwork-Mobile-v1.0.3.zip'
          test -f "$ZIP"
          unzip -tq "$ZIP"
          mkdir -p candy
          unzip -q "$ZIP" -d candy
          test -f candy/tooling/build_in_actions.sh
          test -f candy/tooling/patch_upstream.py

      - name: 7. 验证证书与191条路由
        shell: bash
        run: |
          set -euo pipefail
          python3 candy/tooling/verify.py --require-provision

      - name: 8. 修复 Android API 37
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('candy/tooling/build_in_actions.sh')
          body = p.read_text(encoding='utf-8')

          old = "sdkmanager 'ndk;29.0.14206865' 'platforms;android-37'"
          new = "sdkmanager 'ndk;29.0.14206865' 'platforms;android-36' 'build-tools;36.0.0'"

          anchor = 'python3 "${ROOT}/tooling/patch_upstream.py" upstream'

          fix = '''sed -i 's/^targetSdk = "37"$/targetSdk = "36"/' upstream/gradle/libs.versions.toml
          grep -q '^targetSdk = "36"$' upstream/gradle/libs.versions.toml || exit 1'''

          assert body.count(old) == 1
          assert body.count(anchor) == 1

          body = body.replace(old, new, 1)
          body = body.replace(anchor, anchor + '\n' + fix, 1)

          p.write_text(body, encoding='utf-8')
          print('Android SDK API 36 修复完成')
          PY

          bash -n candy/tooling/build_in_actions.sh

      - name: 9. 编译 Android APK
        shell: bash
        run: |
          set -euo pipefail
          bash candy/tooling/build_in_actions.sh

      - name: 10. 检查 APK
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*.apk' > /dev/null
          ls -lh dist/

      - name: 11. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftCandyNetwork-v1.0.3-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
